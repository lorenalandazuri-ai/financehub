# Corre en cada PR. Estos tres checks son los que exige la regla de la rama main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar los dos servicios con el balanceador local
        run: docker compose up --build -d
      - name: Probar las rutas como en GCP (/ al web, /api a api-catalogo)
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -fs localhost:8080/api/catalogo | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["reports"]))')" = 8
      - if: failure()
        run: docker compose logs

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validar dev y prd (sin conectarse a GCP)
        run: |
          for env in dev prd; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
