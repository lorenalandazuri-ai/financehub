# Encabezados de seguridad del plan (sección 6). Se incluyen en cada location porque un add_header
# dentro de una location anula los del bloque server.
# frame-src: el portal solo podría insertar Looker Studio (hoy abre los tableros en otra pestaña).
# frame-ancestors: ningún otro sitio puede insertar el portal.
add_header Content-Security-Policy "frame-src https://lookerstudio.google.com https://datastudio.google.com; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
