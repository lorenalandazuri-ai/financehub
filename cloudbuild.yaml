# Construye y despliega los dos servicios. Lo dispara el trigger que crea Terraform
# (dev: push a main; hml y prd: tag v*, con aprobación de Lorena).
substitutions:
  _REGION: us-central1
  _REPO: financehub

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "web/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA", "."]
    waitFor: ["-"]
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "api/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-catalogo:$SHORT_SHA", "."]
    waitFor: ["-"]
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-catalogo:$SHORT_SHA
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "api-catalogo", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-catalogo:$SHORT_SHA", "--region=${_REGION}"]
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "financehub-web", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA", "--region=${_REGION}"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api-catalogo:$SHORT_SHA
